name = "ubani-api"
main = "src/index.js"
compatibility_date = "2026-03-06"
workers_dev = true

# R2 is intentionally disabled for now.
# Re-enable when token includes R2 permissions:
# [[r2_buckets]]
# binding = "SITES"
# bucket_name = "ubani-sites"

[vars]
APP_DOMAIN = "https://ubanihosting.co.za"
YOCO_API_URL = "https://payments.yoco.com/api"
ZOHO_API_URL = "https://api.zoho.com"
OPENAI_API_URL = "https://api.openai.com/v1"
REFERRAL_REWARD_CENTS = 5000
TURSO_DATABASE_URL = "libsql://ubani-db-supportubanihosting.aws-eu-west-1.turso.io"
{
  "observability": {
    "enabled": false,
    "head_sampling_rate": 1,
    "logs": {
      "enabled": true,
      "head_sampling_rate": 1,
      "persist": true,
      "invocation_logs": true
    },
    "traces": {
      "enabled": false,
      "persist": true,
      "head_sampling_rate": 1
    }
  }
}
